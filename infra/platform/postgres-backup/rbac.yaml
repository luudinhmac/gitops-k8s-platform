apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-sa
  namespace: blog-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup-velero-secret-reader-binding
  namespace: velero
subjects:
- kind: ServiceAccount
  name: postgres-backup-sa
  namespace: blog-prod
roleRef:
  kind: Role
  name: velero-secret-reader
  apiGroup: rbac.authorization.k8s.io
